spring:
  application:
    name: AiExamTrainerApplication

  datasource:
    url: jdbc:h2:mem:aiexamdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  questions:
    auto-import: true