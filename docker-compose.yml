services:
  backend:
    build:
      context: ./backend
    container_name: ai-exam-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      APP_AI_REQUIRE_ADMIN_TOKEN: ${APP_AI_REQUIRE_ADMIN_TOKEN:-false}
      APP_AI_ADMIN_TOKEN: ${APP_AI_ADMIN_TOKEN:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-exam-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped