services:
  backend:
    build:
      context: ./backend
    container_name: ai-exam-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-exam-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped