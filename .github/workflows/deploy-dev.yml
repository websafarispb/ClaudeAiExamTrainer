name: Deploy dev

on:
  push:
    branches:
      - develop

jobs:
  verify-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run backend tests
        run: mvn -f backend/pom.xml test

  verify-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs:
      - verify-backend
      - verify-frontend

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF
            set -e

            APP_DIR=~/ClaudeAiExamTrainer

            cd "\$APP_DIR"
            git fetch origin
            git checkout develop
            git reset --hard origin/develop

            printf "ANTHROPIC_API_KEY=%s\nAPP_AI_ENABLED=%s\nAPP_AI_REQUIRE_ADMIN_TOKEN=%s\nAPP_AI_ADMIN_TOKEN=%s\n" \
              "${{ secrets.ANTHROPIC_API_KEY }}" \
              "${{ secrets.OPENAI_API_KEY }}" \
              "${{ vars.APP_AI_ENABLED }}" \
              "${{ vars.APP_AI_REQUIRE_ADMIN_TOKEN }}" \
              "${{ secrets.APP_AI_ADMIN_TOKEN }}" > .env

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
          EOF