spring:
  application:
    name: AiExamTrainerApplication

  datasource:
    url: jdbc:h2:mem:aiexamdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  questions:
    auto-import: true
  ai:
    enabled: true
    require-admin-token: false
    admin-token: ""

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-6
    version: 2023-06-01